name: .NET API

on:
  push:
    branches: [ master, main, net8 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BrukerSprRemoteAPI (.NET Framework 4.8 & .NET 8)
        run: dotnet build BrukerSprRemoteAPI/BrukerSprRemoteAPI.csproj --configuration Release

      - name: Build BrukerSprRemoteAPI.Client (.NET Framework 4.8 & .NET 8)
        run: dotnet build BrukerSprRemoteAPI.Client/BrukerSprRemoteAPI.Client.csproj --configuration Release

      - name: Upload BrukerSprRemoteAPI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrukerSprRemoteAPI-Package
          if-no-files-found: error
          path: |
            BrukerSprRemoteAPI/bin/Release/*.nupkg
            
      - name: Upload BrukerSprRemoteAPI.Client Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrukerSprRemoteAPI.Client-Package
          if-no-files-found: error
          path: |
            BrukerSprRemoteAPI.Client/bin/Release/*.nupkg
            
