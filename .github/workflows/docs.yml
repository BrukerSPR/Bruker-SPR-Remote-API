name: Documentation

on:
  push:
    branches: [ master, main, net8 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Documentation and API_Doku.pdf with DocFX
        run: dotnet docfx

      - name: Copy generated API_Doku.pdf
        run: |
          if [ -f "doxfx-documentation/docfx-generated/API_Doku.pdf" ]; then
            cp doxfx-documentation/docfx-generated/API_Doku.pdf ./API_Doku.pdf
          elif [ -f "doxfx-documentation/API_Doku.pdf" ]; then
            cp doxfx-documentation/API_Doku.pdf ./API_Doku.pdf
          elif [ -f "_site/docs/API_Doku.pdf" ]; then
            cp _site/docs/API_Doku.pdf ./API_Doku.pdf
          elif [ -f "_site/API_Doku.pdf" ]; then
            cp _site/API_Doku.pdf ./API_Doku.pdf
          fi

      - name: Upload Documentation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: doxfx-documentation/

      - name: Upload API_Doku.pdf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API_Doku.pdf
          path: API_Doku.pdf
