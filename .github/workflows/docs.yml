name: Documentation

on:
  push:
    branches: [ master, main, net8 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build Documentation and API_Doku.pdf with DocFX
        run: dotnet docfx
        
      - name: Copy generated API_Doku.pdf
        if: |
            (github.ref_name == 'master')
        run: |
          cp docfx-documentation/API_Doku.pdf ./API_Doku.pdf
          
      - name: Commit generated API_Doku.pdf
        if: |
            (github.ref_name == 'master')
        run: |
          git config --local user.name "github-actions[bot]"
          git add API_Doku.pdf
          git commit -m "Automatically updated documentation"

      - name: Push changes
        if: |
            (github.ref_name == 'master')
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
