name: Python API

on:
  push:
    branches: [ master, main, net8 ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-python-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Generator Tests
        run: dotnet test BrukerSprRemoteAPI.Python.Generator.UnitTests/BrukerSprRemoteAPI.Python.Generator.UnitTests.csproj

      - name: Generate Python API
        run: dotnet run --project BrukerSprRemoteAPI.Python.Generator "${{ github.workspace }}/BrukerSprRemoteAPI/IBrukerSprRemoteService.cs" "${{ github.workspace }}/BrukerSprRemoteAPI.Python/BrukerSprRemoteAPI/BrukerSprRemoteAPI.py"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build Python package
        run: |
          cd BrukerSprRemoteAPI.Python
          python -m build

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrukerSprRemoteAPI-Python
          path: BrukerSprRemoteAPI.Python/dist/

      - name: Commit generated Python API
        if: |
            (github.ref_name == 'master')
        run: |
          git config --local user.name "github-actions[bot]"
          git add BrukerSprRemoteAPI.Python/BrukerSprRemoteAPI/BrukerSprRemoteAPI.py
          if ! git diff --cached --quiet; then
            git commit -m "Automatically updated Python API"
          fi

      - name: Push changes
        if: |
            (github.ref_name == 'master')
        uses: ad-m/github-push-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
